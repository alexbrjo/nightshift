<!DOCTYPE html>
<html>
<head>
  <title>Nightshift</title>
  <style>
    body { font-family: sans-serif; margin: 0; display: flex; height: 100vh; overflow: hidden; }
    #sidebar { width: 250px; background: #f0f0f0; border-right: 1px solid #ccc; padding: 10px; overflow-y: auto; }
    #editor-container { flex: 1; display: flex; flex-direction: column; }
    #toolbar { height: 40px; background: #ddd; border-bottom: 1px solid #ccc; display: flex; align-items: center; padding: 0 10px; gap: 10px; }
    #main-content { flex: 1; position: relative; }
    .file-item { cursor: pointer; padding: 4px; border-radius: 3px; }
    .file-item:hover { background: #e0e0e0; }
    .active-file { background: #d0d0d0 !important; font-weight: bold; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script type="text/babel" src="app.js"></script>
</body>
</html>
