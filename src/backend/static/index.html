<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nightshift - Experimentation Platform</title>
    <meta name="description" content="A desktop-first experimentation platform for evaluating LLM-generated context">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: #0f0f13;
            color: #ffffff;
            min-height: 100vh;
        }
        .app {
            display: flex;
            min-height: 100vh;
        }
        .sidebar {
            width: 260px;
            background: #1c1c24;
            border-right: 1px solid #2d2d3a;
            padding: 20px;
        }
        .sidebar-header {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 24px;
        }
        .nav-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 16px;
            color: #a0a0b0;
            text-decoration: none;
            border-radius: 8px;
            margin-bottom: 4px;
        }
        .nav-item:hover {
            background: #2d2d3a;
            color: #ffffff;
        }
        .nav-item.active {
            background: #3b82f6;
            color: #ffffff;
        }
        .main-content {
            flex: 1;
            padding: 24px;
            overflow-y: auto;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }
        .project-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 16px;
        }
        .card {
            background: #1c1c24;
            border: 1px solid #2d2d3a;
            border-radius: 12px;
            padding: 20px;
        }
        .card h3 {
            margin-bottom: 8px;
            color: #ffffff;
        }
        .card p {
            color: #a0a0b0;
            font-size: 14px;
        }
        .btn {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }
        .btn:hover {
            background: #2563eb;
        }
    </style>
</head>
<body>
    <div class="app">
        <aside class="sidebar">
            <div class="sidebar-header">Nightshift</div>
            <nav>
                <a href="/projects" class="nav-item active">📁 Projects</a>
                <a href="/jobs" class="nav-item">⚙️ Jobs</a>
                <a href="/collections" class="nav-item">📦 Collections</a>
                <a href="/pipelines" class="nav-item">🔄 Pipelines</a>
                <a href="/analyses" class="nav-item">📊 Analyses</a>
            </nav>
        </aside>
        <main class="main-content">
            <div class="header">
                <h1>Projects</h1>
                <button class="btn">New Project</button>
            </div>
            <div class="project-grid" id="projectGrid">
                <!-- Projects will be loaded here -->
            </div>
        </main>
    </div>

    <script>
        // Load projects from the API
        async function loadProjects() {
            try {
                const response = await fetch('/api/projects');
                if (response.ok) {
                    const projects = await response.json();
                    renderProjects(projects);
                }
            } catch (error) {
                console.error('Failed to load projects:', error);
            }
        }

        function renderProjects(projects) {
            const grid = document.getElementById('projectGrid');
            if (projects.length === 0) {
                grid.innerHTML = '<div class="card"><p>No projects yet. Create one to get started.</p></div>';
                return;
            }
            grid.innerHTML = projects.map(project => `
                <a href="/projects/${project.id}" class="card" style="text-decoration: none; display: block;">
                    <h3>${project.name}</h3>
                    <p>${project.description || 'No description'}</p>
                </a>
            `).join('');
        }

        loadProjects();
    </script>
</body>
</html>
